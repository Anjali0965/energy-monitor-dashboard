services:
  - type: web
    name: aether-energy-monitor
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: MQTT_HOST
        sync: false
      - key: MQTT_PORT
        value: '8883'
      - key: MQTT_USERNAME
        sync: false
      - key: MQTT_PASSWORD
        sync: false
      - key: MQTT_TOPIC
        value: esp32/energy
